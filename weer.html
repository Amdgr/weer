    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Weer</title>
        <link rel="stylesheet" href="https://cloudflare.com">
    </head>
    <body>
        <header>
            <div class="logo">
                <h1>LOGO</h1>
            </div>
        </header>

        <main>
            <div class="home-text">
                <h2>Breda</h2>
                <p>Nederland, Noord-Brabant</p>
            </div>

            <div class="weather-card">
                <h3>Vandaag 8 October</h3>

                <div class="weather-icon">
                    <img src="img/sun.png" alt="">
                </div>

                <div class="temp">
                    <h4>+15 °C</h4>
                </div>

                <div class="rain">
                    <div class="icon">
                        <img src="img/umbrella.png" alt="">
                    </div>
                    <p>0 mm</p>
                </div>

                <div class="wind">
                    <div class="icon">
                        <img src="img/wind.png" alt="">
                    </div>
                    <p>2 m/s</p>
                </div>
            </div>
            <div class="weather-card">
                <h3>Morgen 9 October</h3>

                <div class="weather-icon">
                    <img src="img/cloudy.png" alt="">
                </div>

                <div class="temp">
                    <h4>+9 °C</h4>
                </div>

                <div class="rain">
                    <div class="icon">
                        <img src="img/umbrella.png" alt="">
                    </div>
                    <p>5 mm</p>
                </div>

                <div class="wind">
                    <div class="icon">
                        <img src="img/wind.png" alt="">
                    </div>
                    <p>6 m/s</p>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy; Amber, &copy;Artem, 2026</p>
        </footer>
    </body>
    </html>
